<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>온톨로지 프로젝트 — 버전 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css" />
</head>
<body>

  <header class="masthead">
    <div class="masthead-inner">
      <p class="eyebrow">직접 구현 · 진행 중인 프로젝트</p>
      <h1>일제강점기 독립운동 &amp; 근대학교 온톨로지</h1>
      <p class="lede">
        인물·학교·단체·사건·장소를 하나의 네트워크로 연결한 온톨로지 시각화입니다.
        프로토타입을 먼저 올리고, 약 한 달간 계속 보완하며 새 버전을 추가할 예정입니다.
        <strong>이전 버전은 지우지 않고 그대로 남겨둡니다</strong> — 변화 과정을 그대로 볼 수 있도록.
      </p>
    </div>
  </header>

  <div class="post-page" style="max-width:820px;">
    <a class="post-back" href="../posts/my-posts.html">&larr; 내가 쓴 글 목록으로</a>

    <div id="version-list"></div>
  </div>

  <footer class="colophon">
    <p>데이터 출처: 우리역사넷 · 한국민족문화대백과사전 · 위키백과 (교차 확인). 시각화는 D3.js 기반 자체 구현입니다.</p>
  </footer>

<script src="versions-data.js"></script>
<script>
  const wrap = document.getElementById("version-list");

  ONTOLOGY_VERSIONS.forEach((v, i) => {
    const card = document.createElement("div");
    card.className = "item";
    card.style.flexDirection = "column";
    card.style.alignItems = "flex-start";
    card.style.padding = "18px 20px";
    card.style.marginBottom = "14px";

    const topRow = document.createElement("div");
    topRow.style.display = "flex";
    topRow.style.alignItems = "baseline";
    topRow.style.gap = "10px";
    topRow.style.flexWrap = "wrap";

    const a = document.createElement("a");
    a.href = v.file;
    a.target = "_blank";
    a.rel = "noopener";
    a.style.fontSize = "1.1rem";
    a.style.fontFamily = "var(--font-display)";
    a.textContent = `${v.version} — ${v.label}`;
    topRow.appendChild(a);

    if (i === 0) {
      const badge = document.createElement("span");
      badge.textContent = "최신";
      badge.style.fontSize = "0.72rem";
      badge.style.padding = "2px 8px";
      badge.style.borderRadius = "999px";
      badge.style.background = "var(--teal)";
      badge.style.color = "var(--paper-card)";
      topRow.appendChild(badge);
    }

    const date = document.createElement("span");
    date.className = "note";
    date.textContent = v.date;
    topRow.appendChild(date);

    card.appendChild(topRow);

    const changelog = document.createElement("p");
    changelog.style.margin = "10px 0 0";
    changelog.style.fontSize = "0.92rem";
    changelog.style.color = "var(--ink-soft)";
    changelog.style.lineHeight = "1.6";
    changelog.textContent = v.changelog;
    card.appendChild(changelog);

    wrap.appendChild(card);
  });
</script>
</body>
</html>

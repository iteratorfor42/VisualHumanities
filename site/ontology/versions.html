<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>온톨로지 프로젝트 — 버전 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css" />

<style>
  /* 1. 헤더 및 전체 상단 레이아웃 중앙 정렬 */
  .masthead {
    text-align: center;
    padding: 60px 20px 40px;
  }
  .masthead-inner {
    max-width: 820px;
    margin: 0 auto;
  }

  /* 2. 본문 컨테이너 중앙 정렬 */
  .post-page {
    max-width: 820px;
    margin: 0 auto 60px; /* 좌우 margin: auto 핵심 */
    padding: 0 20px;
  }

  /* 3. 하단 콜로폰 중앙 정렬 */
  .colophon {
    text-align: center;
    padding: 30px 20px;
  }

  /* 4. 뒤로가기 링크 및 카드 수평 정렬 보완 */
  .post-back {
    display: inline-block;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

  <header class="masthead">
    <div class="masthead-inner">
      <p class="eyebrow">직접 구현 · 진행 중인 프로젝트</p>
      <h2>일제강점기 독립운동 &amp; 근대학교 온톨로지</h2>
      <p class="lede">
        인물·학교·단체·사건·장소를 하나의 네트워크로 연결한 온톨로지 시각화입니다.<br>
        프로토타입을 먼저 올리고, 약 한 달간 계속 보완하며 새 버전을 추가할 예정입니다.<br>
        변화 과정을 그대로 볼 수 있도록 <strong>이전 버전은 지우지 않고 그대로 남겨둡니다.</strong> 
      </p>
    </div>
  </header>

  <!-- style 속성에 margin: 0 auto 추가 -->
  <div class="post-page" style="max-width:820px; margin: 0 auto;">
    <a class="post-back" href="../index.html">&larr; 대문(아카이브)으로 돌아가기</a>
    <p style="margin: 4px 0 24px;">
      <a href="notes.html" style="font-weight:600; color: var(--ink, #2b2620); text-decoration: none;">🛠️ 관련 링크와 시행착오 보러가기 &rarr;</a>
    </p>

    <div id="version-list"></div>
  </div>

  <footer class="colophon">
    <p>데이터 출처: 우리역사넷 · 한국민족문화대백과사전 · 위키백과 (교차 확인). 시각화는 D3.js 기반 자체 구현입니다.</p>
  </footer>

<script src="versions-data.js"></script>
<script>
  const wrap = document.getElementById("version-list");

  ONTOLOGY_VERSIONS.forEach((v, i) => {
    const card = document.createElement("div");
    card.className = "item";
    card.style.flexDirection = "column";
    card.style.alignItems = "flex-start";
    card.style.padding = "18px 20px";
    card.style.marginBottom = "14px";

    const topRow = document.createElement("div");
    topRow.style.display = "flex";
    topRow.style.alignItems = "center"; /* baseline 대신 center로 잡으면 태그와 텍스트 세로 정렬이 더 깔끔해집니다 */
    topRow.style.gap = "10px";
    topRow.style.flexWrap = "wrap";

    const a = document.createElement("a");
    a.href = v.file;
    a.target = "_blank";
    a.rel = "noopener";
    a.style.fontSize = "1.1rem";
    a.style.fontFamily = "var(--font-display)";
    a.textContent = `${v.version} — ${v.label}`;
    topRow.appendChild(a);

    if (i === 0) {
      const badge = document.createElement("span");
      badge.textContent = "최신";
      badge.style.fontSize = "0.72rem";
      badge.style.padding = "2px 8px";
      badge.style.borderRadius = "999px";
      badge.style.background = "var(--teal)";
      badge.style.color = "var(--paper-card)";
      topRow.appendChild(badge);
    }

    const date = document.createElement("span");
    date.className = "note";
    date.textContent = v.date;
    topRow.appendChild(date);

    card.appendChild(topRow);

    const changelog = document.createElement("p");
    changelog.style.margin = "10px 0 0";
    changelog.style.fontSize = "0.92rem";
    changelog.style.color = "var(--ink-soft)";
    changelog.style.lineHeight = "1.6";
    changelog.textContent = v.changelog;
    card.appendChild(changelog);

    wrap.appendChild(card);
  });
</script>
</body>
</html>

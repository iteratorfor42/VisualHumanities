<style>
  :root {
    --paper: #F3EDE0; --paper-2: #EAE2D0; --ink: #2B2620; --ink-soft: #5A5348;
    --hairline: #C9BFA8; --red: #A8342A;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Mono', monospace; }
  header { padding: 24px 32px 16px; border-bottom: 1px solid var(--hairline); }

  .meta b { color: var(--ink); }
  main { padding: 20px 32px 60px; }
  pre#ttl-output {
    background: #fff;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 20px 22px;
    font-size: 12.5px;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre;
    max-width: 980px;
  }
  .tk-comment { color: #9C9384; font-style: italic; }
  .tk-kw { color: var(--red); font-weight: 700; }
  .tk-str { color: #6B7A3D; }
  .tk-iri { color: #2C5C8A; }
  .tk-pname { color: #7A4A9E; }
  .tk-punct { color: #B8AD93; }

    전체 68회 일괄 치환. Person 선언의 rdfs:comment도 placeholder 안내문에서 실제 편찬자 설명으로 정정.<br>
    <b>남은 작업</b>: hasWebResource 항목별 실제 permalink 보강, 시간정보 미상 52건 추정치 보강.
  </div>
</header>

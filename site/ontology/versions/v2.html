<style>
  :root {
    --paper: #F3EDE0; --paper-2: #EAE2D0; --ink: #2B2620; --ink-soft: #5A5348;

  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Mono', monospace; }

  pre#ttl-output {
    background: #fff;
    border: 1px solid var(--hairline);
    border-radius: 4px;

    font-size: 12.5px;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre;
    max-width: 980px;
  }
  .tk-comment { color: #9C9384; font-style: italic; }
  .tk-kw { color: var(--red); font-weight: 700; }
  .tk-str { color: #6B7A3D; }
  .tk-iri { color: #2C5C8A; }
  .tk-pname { color: #7A4A9E; }
